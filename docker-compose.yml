services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commute
      POSTGRES_PASSWORD: commute
      POSTGRES_DB: commute
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commute"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mail"]
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
