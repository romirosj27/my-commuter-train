# Fly.io: worker. Always on, exactly one machine, no public address.
#   fly deploy . --config infra/fly/worker.toml --dockerfile Dockerfile --build-arg APP=worker --ha=false
app = "my-commuter-train-worker"
primary_region = "lhr"

[build]
  [build.args]
    APP = "worker"

[env]
  NODE_ENV = "production"
  WORKER_HEALTH_PORT = "8081"
  EMAIL_TRANSPORT = "resend"
  DATABASE_PREPARE = "false"
  # Feeds stay on mock data until the live adapters are implemented.
  DARWIN_MODE = "mock"
  NETWORK_RAIL_MODE = "mock"
  HSP_MODE = "mock"
  INCIDENTS_MODE = "mock"
  REFERENCE_MODE = "mock"
  # Set as secrets: DATABASE_URL, REDIS_URL, RESEND_API_KEY, EMAIL_FROM,
  # WEB_URL, API_PUBLIC_URL (and feed credentials when live).

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 8081
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
