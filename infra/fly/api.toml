# Fly.io: API. Deploy from the repo root:
#   fly deploy --config infra/fly/api.toml
# Set secrets first: DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, RESEND_API_KEY, ...
app = "my-commuter-train-api"
primary_region = "lhr"

[build]
  dockerfile = "../../Dockerfile"
  [build.args]
    APP = "api"

[deploy]
  # Applies database migrations before the new version takes traffic.
  release_command = "node --import tsx ../../packages/db/src/migrate.ts"

[env]
  NODE_ENV = "production"
  API_PORT = "8080"
  EMAIL_TRANSPORT = "resend"
  # API_PUBLIC_URL, WEB_URL, COOKIE_DOMAIN, EMAIL_FROM, ADMIN_EMAILS: set per environment.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
