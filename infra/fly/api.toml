# Fly.io: API. Deploy from the repository root (see docs/DEPLOY_FLY.md):
#   fly deploy . --config infra/fly/api.toml --dockerfile Dockerfile --build-arg APP=api
app = "my-commuter-train-api"
primary_region = "lhr"

[build]
  [build.args]
    APP = "api"

[deploy]
  # Migrations + reference data before the new version takes traffic.
  release_command = "sh /app/apps/api/scripts/release.sh"

[env]
  NODE_ENV = "production"
  API_PORT = "8080"
  EMAIL_TRANSPORT = "resend"
  # Managed Postgres hands out a PgBouncer (transaction pooling) URL.
  DATABASE_PREPARE = "false"
  # Set as secrets: DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, RESEND_API_KEY,
  # EMAIL_FROM, WEB_URL, API_PUBLIC_URL, ADMIN_EMAILS, COOKIE_DOMAIN.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
