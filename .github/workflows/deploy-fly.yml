name: Deploy to Fly.io

# Manual: Actions → "Deploy to Fly.io" → Run workflow.
# Needs a FLY_API_TOKEN repository secret (fly tokens create deploy -a <app>, or an org token).
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: App name prefix used by infra/fly/setup.sh
        default: my-commuter-train

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-fly
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PREFIX: ${{ inputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: bash infra/fly/deploy.sh
